[build]
  command = "npm run build:site"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"

# Static file routes work at the Netlify site root; no SPA catch-all is needed.
[[redirects]]
  from = "/admin"
  to = "/admin/jobs/"
  status = 302

[[headers]]
  for = "/admin/jobs/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
